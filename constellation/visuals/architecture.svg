<g><rect class="box" x="20" y="706" width="520" height="80" rx="9"/><text class="name" x="38" y="736">Fixed systemd executor</text><text class="detail" x="38" y="762">Perform the admitted unit start</text></g>
<path class="link" d="M420 564V586H280V604"/>
<path class="link" d="M280 692V700"/>
