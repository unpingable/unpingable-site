<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 838" role="img" aria-labelledby="title desc">
<title id="title">Recorded command order</title><desc id="desc">Schematic of final N; exact excerpts are in CYCLE.md.</desc>
