<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 734" role="img" aria-labelledby="title desc">
<title id="title">Operator responsibilities</title><desc id="desc">A guide for participants, not evidence of a human trial.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#727e92"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#172033}.heading{font-size:25px;font-weight:700}.caption{font-size:15px;fill:#455269}.name{font-size:19px;font-weight:650}.detail{font-size:16px;fill:#455269}.box{fill:#f4f7fb;stroke:#b7c3d6;stroke-width:1.5}.link{fill:none;stroke:#727e92;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="560" height="734" rx="12" fill="#fff"/>
<text x="28" y="38" class="heading">Operator responsibilities</text>
<text x="28" y="64" class="caption">A guide for participants, not evidence of a human trial.</text>
<g id="step-1"><rect class="box" x="20" y="88" width="520" height="80" rx="9"/><text class="name" x="38" y="118">Before installation</text><text class="detail" x="38" y="144">Verify the chosen archive and use a fresh local guest</text></g>
<path class="link" d="M280 170V187"/>
<g id="step-2"><rect class="box" x="20" y="192" width="520" height="80" rx="9"/><text class="name" x="38" y="222">Before enrollment</text><text class="detail" x="38" y="248">Read the scope; admit only the selected fixture</text></g>
<path class="link" d="M280 274V291"/>
<g id="step-3"><rect class="box" x="20" y="296" width="520" height="80" rx="9"/><text class="name" x="38" y="326">During observation</text><text class="detail" x="38" y="352">Inspect unit evidence and its age; assess the cause</text></g>
<path class="link" d="M280 378V395"/>
<g id="step-4"><rect class="box" x="20" y="400" width="520" height="80" rx="9"/><text class="name" x="38" y="430">When requesting action</text><text class="detail" x="38" y="456">Provide a preparation identity and run the native steps</text></g>
<path class="link" d="M280 482V499"/>
<g id="step-5"><rect class="box" x="20" y="504" width="520" height="80" rx="9"/><text class="name" x="38" y="534">After the action</text><text class="detail" x="38" y="560">Inspect fresh evidence and the completed attempt</text></g>
<path class="link" d="M280 586V603"/>
<g id="step-6"><rect class="box" x="20" y="608" width="520" height="80" rx="9"/><text class="name" x="38" y="638">If interrupted</text><text class="detail" x="38" y="664">Preserve records and reconcile before trying again</text></g>
<text x="28" y="722" class="caption">Conceptual explanation · not runtime output</text></svg>
